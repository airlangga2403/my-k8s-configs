# DEVELOPMENT MODE
apiVersion: v1
kind: Namespace
metadata:
  name: test

---
# SERVICE INTERNAL (Harus Headless untuk StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: kafka-internal
  namespace: test
  labels:
    app: kafka-test
    unit: kafka
spec:
  clusterIP: None  # PENTING: Headless service untuk resolusi DNS pod stabil
  selector:
    app: kafka-test
    unit: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093

---
# SERVICE EXTERNAL (Akses dari luar cluster)
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: test
  labels:
    app: kafka-test
    unit: kafka
spec:
  type: NodePort
  selector:
    app: kafka-test
    unit: kafka
  ports:
    - name: external
      port: 30992
      targetPort: 9094
      nodePort: 30992

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: test
spec:
  serviceName: "kafka-internal"
  replicas: 1
  selector:
    matchLabels:
      app: kafka-test
      unit: kafka
  template:
    metadata:
      labels:
        app: kafka-test
        unit: kafka
    spec:
      containers:
        - name: kafka
          # Menggunakan Image Apache Official sesuai request
          image: apache/kafka:3.7.0 
          ports:
            - containerPort: 9092
              name: internal
            - containerPort: 9093
              name: controller
            - containerPort: 9094
              name: external
          env:
            # --- KONFIGURASI APACHE KAFKA (Beda dengan Bitnami) ---
            
            # ID Node (Harus 0 karena nama podnya kafka-0)
            - name: KAFKA_NODE_ID
              value: "0"
            
            # Roles (KRaft Mode)
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            
            # Listeners Configuration
            # Kita ganti nama 'INTERNAL' jadi 'PLAINTEXT' karena itu standar Apache
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
            
            # Advertised Listeners (Alamat yang dikasih ke client)
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka-internal.test:9092,EXTERNAL://43.157.209.107:30992"
            
            # Security Map
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
            
            # Controller Quorum (Penting untuk KRaft)
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-internal.test:9093"
            
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            # --- Konfigurasi Lainnya ---
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"