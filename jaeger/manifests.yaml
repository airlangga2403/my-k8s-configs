# jaeger-manifests.yaml

# 1. Namespace untuk Observability (Jaeger, Prometheus, dll)
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# 2. Service untuk Jaeger dengan tipe NodePort
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: observability
  labels:
    app: jaeger
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    # Port untuk UI Web Jaeger
    - name: query-ui
      protocol: TCP
      port: 16686       # Port internal service
      targetPort: 16686 # Port container
      nodePort: 30686   # Port akses dari Browser (http://IP:30686)
    
    # Port untuk menerima data trace dari Spring Boot (OpenTelemetry)
    - name: otlp-grpc
      protocol: TCP
      port: 4317        # Port standar OTLP
      targetPort: 4317  # Port container
      nodePort: 30317   # Port akses dari Laptop/Agent (http://IP:30317)
---
# 3. Deployment untuk Jaeger All-in-One
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-deployment
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.53 # Versi stabil
        env:
          # PENTING: Mengaktifkan OTLP agar bisa menerima data dari OpenTelemetry Agent
          - name: COLLECTOR_OTLP_ENABLED
            value: "true"
          # Opsional: Membatasi penggunaan memori
          - name: MEMORY_MAX_TRACES
            value: "10000"
        ports:
        - containerPort: 16686 # UI
        - containerPort: 4317  # OTLP gRPC
        - containerPort: 4318  # OTLP HTTP
        - containerPort: 14268 # Thrift (Legacy)
        readinessProbe:
          httpGet:
            path: "/"
            port: 14269
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"